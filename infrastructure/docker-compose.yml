services:
  postgres:
    image: postgres:16
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
    - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
  auth-service:
    build:
      context: ..
      dockerfile: backend/auth-service/Dockerfile
    env_file:
      - ../.env
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - VAULT_ADDR=http://vault:8200
      - VAULT_KV_PATHS=kv/data/app
      - VAULT_OVERRIDE=true
    expose:
      - "8000"
    networks:
      - internal
    depends_on:
      - postgres

  user-service:
    build:
      context: ..
      dockerfile: backend/user-service/Dockerfile
    expose:
      - "8001"
    networks:
      - internal

  diary-service:
    build:
      context: ..
      dockerfile: backend/diary-service/Dockerfile
    env_file:
      - ../.env
    environment:
      - PORT=8002
      - CORS_ORIGINS=https://localhost:5173,https://127.0.0.1:5173
      - PGHOST=postgres
      - PGPORT=5432
      - WS_SERVER_URL=http://realtime-service:8003
      - DIARY_REQUEST_BODY_LIMIT=10mb
      - VAULT_ADDR=http://vault:8200
      - VAULT_KV_PATHS=kv/data/app
      - VAULT_OVERRIDE=true
    expose:
      - "8002"
    networks:
      - internal
    depends_on:
      - postgres

  realtime-service:
    build:
      context: ..
      dockerfile: backend/realtime-service/Dockerfile
    env_file:
      - ../.env
    environment:
      - CORS_ORIGINS=https://localhost:5173,https://127.0.0.1:5173
      - PGHOST=postgres
      - PGPORT=5432
      - VAULT_ADDR=http://vault:8200
      - VAULT_KV_PATHS=kv/data/app
      - VAULT_OVERRIDE=true
    expose:
      - "8003"
    networks:
      - internal
    depends_on:
      - postgres

  api-gateway:
    build:
      context: ..
      dockerfile: backend/api-gateway/Dockerfile
    expose:
      - "8080"
    depends_on:
      - auth-service
      - user-service
      - diary-service
      - realtime-service
    env_file:
      - ../.env
    environment:
      - CORS_ORIGINS=https://localhost:5173,https://127.0.0.1:5173
      - VAULT_ADDR=http://vault:8200
      - VAULT_KV_PATHS=kv/data/app
      - VAULT_OVERRIDE=true
    ports:
      - "8080:8080"
    networks:
      - internal

  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: security_waf
    ports:
      - "8081:443"
      - "8082:80"
    volumes:
      - ../backend/waf/config/modsecurity-hardened.conf:/etc/nginx/modsec/modsecurity-hardened.conf:ro
      - ../backend/waf/config/default.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    environment:
      - BACKEND=http://api-gateway:8080
      - WS_BACKEND=http://realtime-service:8003
      - PARANOIA=1
    depends_on:
      - api-gateway
    networks:
      - external
      - internal

    # ✅ OVERRIDE the image healthcheck (THIS IS A MAPPING)
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  vault:
    image: hashicorp/vault:1.15
    container_name: security_vault
    command: ["vault", "server", "-config=/vault/config/config.hcl"]
    ports:
      - "8200:8200"
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_API_ADDR=http://vault:8200
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault/config.hcl:/vault/config/config.hcl:ro
      - vault-data:/vault/file
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8200/v1/sys/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - internal

networks:
  external:
  internal:

volumes:
  vault-data:
