services:
  postgres:
    image: postgres:16
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
    - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
  auth-service:
    build:
      context: ..
      dockerfile: backend/auth-service/Dockerfile
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - VAULT_ADDR=https://vault:8200
      - VAULT_KV_PATHS=secret/data/app
      - VAULT_OVERRIDE=true
      - VAULT_TLS_SKIP_VERIFY=true
      - VAULT_TOKEN_FILE=/vault/shared/app-token
    expose:
      - "8000"
    volumes:
      - vault-shared:/vault/shared:ro
    networks:
      - internal
    depends_on:
      - postgres
      - vault-bootstrap

  diary-service:
    build:
      context: ..
      dockerfile: backend/diary-service/Dockerfile
    environment:
      - PORT=8002
      - CORS_ORIGINS=https://localhost:5173,https://127.0.0.1:5173
      - PGHOST=postgres
      - PGPORT=5432
      - WS_SERVER_URL=http://realtime-service:8003
      - DIARY_REQUEST_BODY_LIMIT=10mb
      - VAULT_ADDR=https://vault:8200
      - VAULT_KV_PATHS=secret/data/app
      - VAULT_OVERRIDE=true
      - VAULT_TLS_SKIP_VERIFY=true
      - VAULT_TOKEN_FILE=/vault/shared/app-token
    expose:
      - "8002"
    volumes:
      - vault-shared:/vault/shared:ro
    networks:
      - internal
    depends_on:
      - postgres
      - vault-bootstrap

  realtime-service:
    build:
      context: ..
      dockerfile: backend/realtime-service/Dockerfile
    environment:
      - CORS_ORIGINS=https://localhost:5173,https://127.0.0.1:5173
      - PGHOST=postgres
      - PGPORT=5432
      - VAULT_ADDR=https://vault:8200
      - VAULT_KV_PATHS=secret/data/app
      - VAULT_OVERRIDE=true
      - VAULT_TLS_SKIP_VERIFY=true
      - VAULT_TOKEN_FILE=/vault/shared/app-token
    expose:
      - "8003"
    volumes:
      - vault-shared:/vault/shared:ro
    networks:
      - internal
    depends_on:
      - postgres
      - vault-bootstrap

  api-gateway:
    build:
      context: ..
      dockerfile: backend/api-gateway/Dockerfile
    expose:
      - "8080"
    depends_on:
      - auth-service
      - diary-service
      - realtime-service
    environment:
      - CORS_ORIGINS=https://localhost:5173,https://127.0.0.1:5173
      - VAULT_ADDR=https://vault:8200
      - VAULT_KV_PATHS=secret/data/app
      - VAULT_OVERRIDE=true
      - VAULT_TLS_SKIP_VERIFY=true
      - VAULT_TOKEN_FILE=/vault/shared/app-token
    ports:
      - "8080:8080"
    volumes:
      - vault-shared:/vault/shared:ro
    networks:
      - internal

  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: security_waf
    ports:
      - "8081:443"
      - "8082:80"
    volumes:
      - ../backend/waf/config/modsecurity-hardened.conf:/etc/nginx/modsec/modsecurity-hardened.conf:ro
      - ../backend/waf/config/default.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    environment:
      - BACKEND=http://api-gateway:8080
      - WS_BACKEND=http://realtime-service:8003
      - PARANOIA=1
    depends_on:
      - api-gateway
    networks:
      - external
      - internal

    # ✅ OVERRIDE the image healthcheck (THIS IS A MAPPING)
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  vault:
    image: hashicorp/vault:1.15
    container_name: security_vault
    # Dev TLS mode: encrypted transport, but still dev semantics (do not use for production)
    command: ["vault", "server", "-dev", "-dev-tls", "-dev-listen-address=0.0.0.0:8200", "-dev-root-token-id=my-secret-token"]
    environment:
      - VAULT_ADDR=https://vault:8200
      - VAULT_API_ADDR=https://vault:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=https://127.0.0.1:8200 vault status -tls-skip-verify >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - internal

  vault-bootstrap:
    image: curlimages/curl:8.6.0
    user: "0:0"
    env_file:
      - ../.env
    environment:
      - VAULT_ADDR=https://vault:8200
      - VAULT_TLS_SKIP_VERIFY=true
    volumes:
      - ./vault/seed.sh:/vault/seed.sh:ro
      - ./vault/bootstrap.sh:/bootstrap.sh:ro
      - vault-shared:/vault/shared
    command: ["sh", "/bootstrap.sh"]
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - internal

networks:
  external:
  internal:

volumes:
  vault-data:
  vault-shared:
