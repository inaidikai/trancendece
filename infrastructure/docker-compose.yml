services:
  auth-service:
    build: ../backend/auth-service
    env_file:
      - ../.env
    environment:
      - JWT_SECRET=dev-super-secret-change-me
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-your-client-id-here}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-your-client-secret-here}
      - GOOGLE_REDIRECT_URI=https://quillow.local:8081/auth/google/callback
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=auth_db
    expose:
      - "8000"
    networks:
      - internal

  user-service:
    build: ../backend/user-service
    expose:
      - "8001"
    networks:
      - internal

  diary-service:
    build: ../backend/diary-service
    environment:
      - PORT=8002
      - JWT_SECRET=dev-super-secret-change-me
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=auth_db
      - WS_SERVER_URL=http://realtime-service:8003
      - DIARY_REQUEST_BODY_LIMIT=10mb
    expose:
      - "8002"
    networks:
      - internal
    depends_on:
      - postgres

  realtime-service:
    build: ../backend/realtime-service
    environment:
      - JWT_SECRET=dev-super-secret-change-me
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=auth_db
    expose:
      - "8003"
    networks:
      - internal
    depends_on:
      - postgres

  api-gateway:
    build: ../backend/api-gateway
    expose:
      - "8080"
    depends_on:
      - auth-service
      - user-service
      - diary-service
      - realtime-service
    environment:
      - JWT_SECRET=dev-super-secret-change-me
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8080:8080"
    networks:
      - internal

  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: security_waf
    ports:
      - "8081:443"
      - "8082:80"
    volumes:
      - ../backend/waf/config/modsecurity-hardened.conf:/etc/nginx/modsec/modsecurity-hardened.conf:ro
      - ../backend/waf/config/default.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./certs/quillow.local.crt:/etc/nginx/certs/quillow.local.crt:ro
      - ./certs/quillow.local.key:/etc/nginx/certs/quillow.local.key:ro
    environment:
      - BACKEND=http://api-gateway:8080
      - WS_BACKEND=http://realtime-service:8003
      - PARANOIA=1
    depends_on:
      - api-gateway
    networks:
      - external
      - internal

    # ✅ OVERRIDE the image healthcheck (THIS IS A MAPPING)
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
    - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal


  vault:
    image: hashicorp/vault:1.15
    container_name: security_vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=my-secret-token
      - VAULT_ADDR=http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      - internal

networks:
  external:
  internal:
