services:
  auth-service:
    build: ../backend/auth-service
    environment:
      - JWT_SECRET=dev-super-secret-change-me
    expose:
      - "8000"
    networks:
      - internal

  user-service:
    build: ../backend/user-service
    expose:
      - "8001"
    networks:
      - internal

  diary-service:
    build: ../backend/diary-service
    expose:
      - "8002"
    networks:
      - internal

  realtime-service:
    build: ../backend/realtime-service
    environment:
      - JWT_SECRET=dev-super-secret-change-me
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=auth_db
    expose:
      - "8003"
    networks:
      - internal
    depends_on:
      - postgres

  api-gateway:
    build: ../backend/api-gateway
    expose:
      - "8080"
    depends_on:
      - auth-service
      - user-service
      - diary-service
      - realtime-service
    environment:
      - JWT_SECRET=dev-super-secret-change-me
    ports:
      - "8080:8080"
    networks:
      - internal

  waf:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: security_waf
    ports:
      - "8081:80"
    volumes:
      - ../backend/waf/config/modsecurity-hardened.conf:/etc/nginx/modsec/modsecurity-hardened.conf:ro
      - ../backend/waf/config/default.conf:/etc/nginx/templates/conf.d/default.conf.template:ro
    environment:
      - BACKEND=http://api-gateway:8080
      - PARANOIA=1
    depends_on:
      - api-gateway
    networks:
      - external
      - internal

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
    - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal


  vault:
    image: hashicorp/vault:1.15
    container_name: security_vault
    ports:
      - "8200:8200"
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=my-secret-token
      - VAULT_ADDR=http://0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      - internal

networks:
  external:
  internal:
