server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream ${BACKEND};
    set $ws_upstream ${WS_BACKEND};

   location /socket.io/ {
    # Socket.IO polling/websocket framing is frequently flagged by generic CRS rules.
    # Keep WAF enabled for app routes, but bypass it for realtime transport.
    modsecurity off;
    proxy_pass $ws_upstream;
    proxy_set_header Host $host;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_buffering off;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
}



    location / {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_buffering off;
    }
}
