server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream ${BACKEND};
    set $ws_upstream ${WS_BACKEND};

   location /socket.io/ {
    # Socket.IO polling/websocket framing is frequently flagged by generic CRS rules.
    # Keep WAF enabled for app routes, but bypass it for realtime transport.
    modsecurity off;
    proxy_pass $ws_upstream;
    proxy_set_header Host $host;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_buffering off;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
}



    location ^~ /diary/api/entries {
        # Diary entry autosave payloads can be large JSON blobs.
        modsecurity on;
        modsecurity_rules 'SecRequestBodyLimit 10485760';
        modsecurity_rules 'SecRequestBodyNoFilesLimit 10485760';
        # Allow rich diary editor payloads on entry routes (HTML snippets + data:image/*;base64 URLs).
        # Keep CRS enabled elsewhere and only suppress known false positives for this route.
        modsecurity_rules 'SecRule REQUEST_URI "@beginsWith /diary/api/entries" "id:110001,phase:1,pass,nolog,ctl:ruleRemoveByTag=attack-xss,ctl:ruleRemoveById=911100,ctl:ruleRemoveById=921130,ctl:ruleRemoveById=932235,ctl:ruleRemoveById=932260,ctl:ruleRemoveById=934170"';
        client_max_body_size 10m;

        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_buffering off;
    }

    location / {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_buffering off;
    }
}
