server {
    listen 80;
    server_name quillow.local localhost;
    return 301 https://$host:8081$request_uri;
}

server {
    listen 443 ssl;
    server_name quillow.local localhost;

    ssl_certificate     /etc/nginx/certs/quillow.local.crt;
    ssl_certificate_key /etc/nginx/certs/quillow.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

   location /socket.io/ {
    proxy_pass http://realtime-service:8003;
    proxy_set_header Host $host;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_buffering off;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
}



    location / {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_buffering off;
    }
}
