user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format to see real client IPs behind the WAF
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;

    # WebSocket Support: Maps the Upgrade header to the Connection header
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Global WAF Settings
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    # Define your backend services
    upstream express_backend {
        server express-api:3000; 
    }

    upstream api_gateway {
        server api-gateway:8080;
    }

    server {
        listen 80;
        server_name _;

        # --- ModSecurity Rules & Hardening ---
        # Include standard OWASP rules
        Include /etc/nginx/modsec/modsecurity.conf
        SecRuleEngine On
        SecDefaultAction "phase:1,deny,status:403"
        SecDefaultAction "phase:2,deny,status:403"
        
        # Performance/Size Limits
        SecRequestBodyLimit 10485760
        SecRequestBodyNoFiles Off
        SecResponseBodyLimit 524288
        SecPcreMatchLimit 1000
        SecPcreMatchLimitRecursion 1000

        Include /etc/nginx/owasp-modsecurity-crs/crs-setup.conf
        Include /etc/nginx/owasp-modsecurity-crs/rules/*.conf

        # Rate Limiting for Friend Search
        SecAction "id:900001,phase:1,nolog,pass,initcol:ip=%{REMOTE_ADDR}"
        SecRule REQUEST_URI "@contains /api/users/search" \
            "id:900002,phase:2,pause,deny,status:429,setvar:ip.search_count=+1,expirevar:ip.search_count=60" \
            "chain"
        SecRule IP:SEARCH_COUNT "@gt 20" ""

        # --- Routing ---

        # Route 1: Express Backend (With WebSocket Support)
        location /api/v1/ { 
            proxy_pass http://express_backend;
            proxy_http_version 1.1;
            
            # Headers for WebSockets/Long Polling
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Forwarding Client Info
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for "Online" heartbeats
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Route 2: Default API Gateway
        location / {
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}