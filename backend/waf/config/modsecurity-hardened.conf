Include /etc/nginx/modsec/modsecurity.conf

SecRuleEngine On
SecDefaultAction "phase:1,log,deny,status:403"
SecDefaultAction "phase:2,log,deny,status:403"

SecRequestBodyAccess On
SecRequestBodyLimit 10485760
SecRequestBodyNoFilesLimit 10485760
SecResponseBodyLimit 524288
SecPcreMatchLimit 1000
SecPcreMatchLimitRecursion 1000

Include /etc/nginx/owasp-modsecurity-crs/crs-setup.conf
Include /etc/nginx/owasp-modsecurity-crs/rules/*.conf

# Per-IP counters used for targeted throttling.
SecAction "id:100001,phase:1,pass,nolog,initcol:ip=%{REMOTE_ADDR}"

# Only allow common API methods.
SecRule REQUEST_METHOD "!@within GET HEAD POST PUT PATCH DELETE OPTIONS" \
  "id:100010,phase:1,deny,status:405,log,msg:'Method not allowed by WAF policy'"

# Auth endpoint throttle to reduce brute-force and OAuth abuse.
SecRule REQUEST_URI "@rx ^/(auth|api/auth)/(login|register|forgot-password|reset-password|google/auth-url|google/callback)$" \
  "id:100020,phase:2,pass,nolog,setvar:ip.auth_req_count=+1,expirevar:ip.auth_req_count=60"
SecRule IP:AUTH_REQ_COUNT "@gt 40" \
  "id:100021,phase:2,deny,status:429,log,msg:'Auth rate limit exceeded'"

# Friend search throttle.
SecRule REQUEST_URI "@contains /api/users/search" \
  "id:100030,phase:2,pass,nolog,setvar:ip.search_req_count=+1,expirevar:ip.search_req_count=60"
SecRule IP:SEARCH_REQ_COUNT "@gt 30" \
  "id:100031,phase:2,deny,status:429,log,msg:'Search rate limit exceeded'"



